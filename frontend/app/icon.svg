<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Subtle Radial -->
    <radialGradient id="bgLight" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>

    <!-- TechniX Indigo/Purple Gradient -->
    <linearGradient id="technixPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#461099" />
      <stop offset="100%" stop-color="#220452" />
    </linearGradient>

    <!-- TechniX 'X' Cyan-Mint Gradient -->
    <linearGradient id="technixCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5BE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- UM6P Terracotta Orange-Red Gradient for Accent / Node -->
    <linearGradient id="um6pOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#E04F26" />
    </linearGradient>

    <!-- Soft Ambient Glow & Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2D0668" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00E5BE" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgLight)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#E2E8F0" stroke-width="3" />

  <!-- Center Emblem: Pure TechniX 'X' Emblem with Capacity Hub Aesthetics -->
  <g filter="url(#cardShadow)" transform="translate(106, 106)">
    <!-- Primary TechniX Rounded Card -->
    <rect width="300" height="300" rx="64" fill="url(#technixPurple)" />
    
    <!-- Inner Subtle Border Accent -->
    <rect width="292" height="292" x="4" y="4" rx="60" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.3" />

    <!-- Branch 1: Deep Tech Indigo / White Arm (Top-Left to Bottom-Right) -->
    <line x1="75" y1="75" x2="225" y2="225" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />
    
    <!-- Branch 2: TechniX Signature Mint / Cyan Glow Arm (Top-Right to Bottom-Left) -->
    <line x1="225" y1="75" x2="75" y2="225" stroke="url(#technixCyan)" stroke-width="32" stroke-linecap="round" />

    <!-- Center Overlap Hub Node -->
    <circle cx="150" cy="150" r="18" fill="#FFFFFF" />
    <circle cx="150" cy="150" r="10" fill="url(#um6pOrange)" />

    <!-- Top-Right Energy Spark Node (TechniX Cyan) -->
    <circle cx="225" cy="75" r="12" fill="#00E5BE" />
    <circle cx="225" cy="75" r="6" fill="#FFFFFF" />

    <!-- Bottom-Right Target Indicator (UM6P Orange) -->
    <circle cx="225" cy="225" r="10" fill="url(#um6pOrange)" />
    <circle cx="225" cy="225" r="5" fill="#FFFFFF" />
  </g>
</svg>
