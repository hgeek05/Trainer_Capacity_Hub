<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- TechniX Deep Indigo/Purple Gradient (Full Canvas Fill) -->
    <linearGradient id="technixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B1299" />
      <stop offset="100%" stop-color="#1E044B" />
    </linearGradient>

    <!-- TechniX 'X' Cyan-Mint Signature Gradient -->
    <linearGradient id="technixCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5BE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- UM6P Terracotta Orange-Red Accent Gradient -->
    <linearGradient id="um6pOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#E04F26" />
    </linearGradient>

    <!-- Subtle Inner Glow / Border Highlight -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="branchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F0226" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Full-Bleed Rounded Violet Card (No white margins) -->
  <rect width="512" height="512" rx="112" fill="url(#technixBg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#innerGlow)" stroke-width="4" />

  <!-- Center 'X' Emblem Scaled Up for Favicon Readability -->
  <g filter="url(#branchShadow)">
    <!-- Branch 1: Clean White Arm (Top-Left to Bottom-Right) -->
    <line x1="130" y1="130" x2="382" y2="382" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" />

    <!-- Branch 2: TechniX Vibrant Cyan / Mint Arm (Top-Right to Bottom-Left) -->
    <line x1="382" y1="130" x2="130" y2="382" stroke="url(#technixCyan)" stroke-width="52" stroke-linecap="round" />

    <!-- Center Overlap Hub Node -->
    <circle cx="256" cy="256" r="30" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="17" fill="url(#um6pOrange)" />

    <!-- Top-Right Energy Spark Node (TechniX Cyan) -->
    <circle cx="382" cy="130" r="20" fill="#00E5BE" />
    <circle cx="382" cy="130" r="10" fill="#FFFFFF" />

    <!-- Bottom-Right Target Indicator (UM6P Orange) -->
    <circle cx="382" cy="382" r="17" fill="url(#um6pOrange)" />
    <circle cx="382" cy="382" r="8" fill="#FFFFFF" />
  </g>
</svg>
